[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "a-jobseeker"
dynamic = ["version"]
description = "Scrapes job offers, selects the ones matching your profile with an AI and generates a tailored CV for each."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Skalyaev" }]
keywords = ["jobs", "job-search", "linkedin", "cv", "resume", "ai", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Typing :: Typed",
]
dependencies = [
    "beautifulsoup4>=4.13",
    "pydantic>=2.7",
    "reportlab>=4.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.10",
    "pdfminer.six>=20231228",
    "pypdf>=4",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "twine>=5",
    "types-requests",
]

[project.urls]
Homepage = "https://github.com/Skalyaev/a-jobseeker"
Repository = "https://github.com/Skalyaev/a-jobseeker"
Issues = "https://github.com/Skalyaev/a-jobseeker/issues"

[project.scripts]
a-jobseeker = "a_jobseeker.cli:main"

[tool.setuptools.dynamic]
version = { attr = "a_jobseeker.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
a_jobseeker = ["py.typed", "resources/*.json", "templates/locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["a_jobseeker"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RET", "PTH", "TID", "RUF", "D",
]
ignore = [
    "D100", # module docstrings
    "D104", # package docstrings
    "D105", # magic methods
    "D107", # __init__ (documented on the class)
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true
